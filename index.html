<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e5c4a">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="面向制造业提供能耗数据管理、碳数据核算、绿色工厂申报数据支持及物联网平台技术服务。">
<title>制造业绿色低碳技术服务</title>
<style>
:root{
  --green:#0e5c4a;--green2:#13866b;--mint:#e8f5f0;
  --ink:#172821;--muted:#61736b;--bg:#f2f7f4;--line:#e2ece7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{width:100%;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:auto}
body{
  margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);overflow-wrap:break-word;word-wrap:break-word;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
.page{width:100%;max-width:520px;margin:0 auto;padding-bottom:24px;overflow:hidden}
.hero{
  position:relative;overflow:hidden;padding:28px 22px 26px;color:#fff;
  background:linear-gradient(145deg,#083f34 0%,#0e5c4a 55%,#159775 100%);
  border-radius:0 0 25px 25px;
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:210px;height:210px;right:-82px;top:-92px;background:rgba(255,255,255,0.05)}
.hero:after{width:155px;height:155px;right:40px;bottom:-115px;background:rgba(255,255,255,0.04)}
.tag{
  display:inline-block;position:relative;z-index:1;padding:4px 10px;margin-bottom:15px;
  border:1px solid rgba(255,255,255,0.38);border-radius:20px;background:rgba(255,255,255,0.09);
  font-size:11px;letter-spacing:.05em;
}
h1{position:relative;z-index:1;margin:0 0 12px;font-size:29px;line-height:1.35;letter-spacing:.01em}
h1 span{color:#8de2bd}
.hero p{position:relative;z-index:1;margin:0;max-width:390px;color:#e5f5ed;font-size:14px;line-height:1.8}
.hero-art{position:absolute;right:13px;bottom:0;width:130px;height:105px;opacity:.85}
main{display:block;padding:14px 12px 0;min-width:0}
.section{
  background:#fff;border-radius:17px;margin-bottom:13px;padding:17px 14px;
  box-shadow:0 2px 8px rgba(23,77,59,0.03);
}
.section-title{display:flex;align-items:center;gap:9px;margin:0 0 14px;font-size:19px;line-height:1.3}
.num{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;height:34px;
  color:white;background:linear-gradient(145deg,#159a75,#08634f);border-radius:10px;font-size:18px;
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.tile{padding:13px 10px;background:#f2f9f6;border:1px solid #edf5f1;border-radius:12px;min-width:0}
.symbol{
  display:flex;align-items:center;justify-content:center;width:39px;height:39px;margin:0 auto 8px;
  border-radius:12px;color:#fff;background:linear-gradient(145deg,#19a982,#08735a);
  font-size:20px;font-weight:700;
}
.tile h3{font-size:14px;text-align:center;margin:0 0 5px}
.tile p{font-size:12px;color:var(--muted);text-align:center;line-height:1.65;margin:0}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.flow-item{position:relative;text-align:center;padding:13px 8px;background:#f2f9f6;border-radius:12px}
.flow-item .symbol{margin-bottom:7px}
.flow-item b{display:block;font-size:14px;margin-bottom:4px}
.flow-item p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.check{padding:5px 9px;border-radius:20px;background:#e9f6f0;color:#14765d;font-size:11.5px}
.check:before{content:"✓ ";font-weight:800}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 10px}
.feature{text-align:center;padding:2px 5px}
.feature .symbol{border-radius:50%;width:43px;height:43px}
.feature b{display:block;font-size:14px;margin-bottom:3px}
.feature p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.partners{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.partner{padding:12px 10px;border:1px solid var(--line);border-radius:11px;background:#fbfdfc}
.partner .emoji{font-size:21px;margin-bottom:5px}
.partner b{display:block;font-size:13px;margin-bottom:4px}
.partner p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.note{
  display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:12px;
  border-radius:12px;background:#e9f6f0;color:#155c49;font-size:12.5px;
}
.note .leaf{font-size:22px;line-height:1.2}
.cta{
  padding:18px 15px;border-radius:15px;color:#fff;
  background:linear-gradient(135deg,#084b3c,#0e7258);
}
.cta h3{font-size:17px;margin:0 0 5px}
.cta p{margin:0 0 13px;font-size:12.5px;color:#d3e9df}
.cta-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;min-width:0}
.contact{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:42px;padding:0 16px;background:#fff;color:#0e654f;border-radius:24px;
  text-decoration:none;font-size:13px;font-weight:700;flex:0 0 auto;min-height:44px;
}
.cta-small{font-size:11.5px;color:#c6e2d6;line-height:1.55;min-width:0;overflow-wrap:anywhere}
footer{text-align:center;padding:17px 12px 0;color:#8b9c94;font-size:11px}
@media(min-width:420px){
  .hero{padding:32px 24px 30px}
  h1{font-size:32px}
  main{padding-left:14px;padding-right:14px}
  .section{padding:19px 16px}
}
@media(max-width:350px){
  h1{font-size:26px}
  .section-title{font-size:17px}
  .tile{padding:11px 7px}
  .partners{grid-template-columns:1fr}
}

/* 老版本内置浏览器的布局兜底：优先保证内容可见 */
.grid, .flow, .features, .partners {
  display: flex;
  flex-wrap: wrap;
  margin-left: -4px;
  margin-right: -4px;
}
.grid > .tile, .flow > .flow-item,
.features > .feature, .partners > .partner {
  width: calc(50% - 8px);
  min-width: 0;
  margin: 4px;
}
@supports (display: grid) {
  .grid, .flow, .features, .partners {
    display: grid;
    margin-left: 0;
    margin-right: 0;
  }
  .grid > .tile, .flow > .flow-item,
  .features > .feature, .partners > .partner {
    width: auto;
    margin: 0;
  }
}
@media (max-width: 350px) {
  .grid, .flow, .features {
    grid-template-columns: 1fr;
  }
  .grid > .tile, .flow > .flow-item,
  .features > .feature {
    width: auto;
  }
}

</style>
</head>
<body>
<div class="page" id="top">
  <header class="hero">
    <div class="tag">个人技术服务 · 合作说明</div>
    <h1>用数据让制造业<br><span>更绿色、更低碳</span></h1>
    <p>我自己开发了一套能碳平台，帮企业把能耗数据管起来、算清楚，再整理成申报和碳核算需要的材料。</p>
  </header>

  
</div>
</body>
</html>
